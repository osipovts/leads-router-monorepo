services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: '${POSTGRES_USER:-postgres}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}'
      POSTGRES_DB: '${POSTGRES_DB:-leads}'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  redis:
    image: redis:8-alpine
    hostname: '${REDIS_HOST:-redis}'
    restart: unless-stopped
    env_file:
      - .env
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD" --port $$REDIS_PORT
    environment:
      REDIS_PASSWORD: '${REDIS_PASSWORD:?Set REDIS_PASSWORD in the root .env file}'
    volumes:
      - redis-data:/redis-data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '$$REDIS_PASSWORD', 'ping']
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  bullboard:
    image: venatum/bull-board:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '${BULLBOARD_FORWARD_PORT:-4000}:3000'
    depends_on:
      redis:
        condition: service_healthy

  gateway:
    build:
      target: gateway
    restart: unless-stopped
    init: true
    env_file:
      - ./apps/gateway/.env
    ports:
      - '${GATEWAY_FORWARD_PORT:-3000}:3000'
    depends_on:
      redis:
        condition: service_healthy

  router:
    build:
      target: router
    restart: unless-stopped
    init: true
    env_file:
      - ./apps/router/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  migrate:
    build:
      target: migrate
    restart: 'no'
    env_file:
      - ./apps/router/.env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
