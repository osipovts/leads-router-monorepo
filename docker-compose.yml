services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: '${POSTGRES_USER:-postgres}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}'
      POSTGRES_DB: '${POSTGRES_DB:-leads}'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  redis:
    image: redis:8-alpine
    hostname: '${REDIS_HOST:-redis}'
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD" --port $$REDIS_PORT
    environment:
      REDIS_PASSWORD: '${REDIS_PASSWORD:?Set REDIS_PASSWORD in the root .env file}'
      REDIS_PORT: '${REDIS_PORT:-6379}'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli -e -p "$$REDIS_PORT" ping']
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  bullboard:
    image: venatum/bull-board@sha256:67cb373b9c8dce8aea70a449324cc8aa05e6370c9094948e750053c5bdc37d16
    restart: unless-stopped
    environment:
      REDIS_HOST: '${REDIS_HOST:-redis}'
      REDIS_PORT: '${REDIS_PORT:-6379}'
      REDIS_PASSWORD: '${REDIS_PASSWORD:?Set REDIS_PASSWORD in the root .env file}'
      USER_LOGIN: '${BULLBOARD_USER:?Set BULLBOARD_USER in the root .env file}'
      USER_PASSWORD: '${BULLBOARD_PASSWORD:?Set BULLBOARD_PASSWORD in the root .env file}'
    ports:
      - '127.0.0.1:${BULLBOARD_FORWARD_PORT:-4000}:3000'
    depends_on:
      redis:
        condition: service_healthy

  gateway:
    build:
      target: gateway
    restart: unless-stopped
    init: true
    env_file:
      - ./apps/gateway/.env
    ports:
      - '127.0.0.1:${GATEWAY_FORWARD_PORT:-3000}:3000'
    depends_on:
      redis:
        condition: service_healthy

  router:
    build:
      target: router
    restart: unless-stopped
    init: true
    stop_grace_period: '${ROUTER_STOP_GRACE_PERIOD:-11m}'
    env_file:
      - ./apps/router/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      target: frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_FORWARD_PORT:-5173}:80'
    depends_on:
      - gateway

  migrate:
    build:
      target: migrate
    restart: 'no'
    env_file:
      - ./apps/router/.env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
