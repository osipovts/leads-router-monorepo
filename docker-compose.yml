services:
  redis:
    image: redis:8-alpine
    hostname: '${REDIS_HOST:-redis}'
    restart: unless-stopped
    env_file:
      - .env
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD" --port $$REDIS_PORT
    environment:
      REDIS_PASSWORD: '${REDIS_PASSWORD:?Set REDIS_PASSWORD in the root .env file}'
    volumes:
      - redis-data:/redis-data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '$$REDIS_PASSWORD', 'ping']
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  bullboard:
    image: venatum/bull-board:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '${BULLBOARD_FORWARD_PORT:-4000}:3000'
    depends_on:
      redis:
        condition: service_healthy

  gateway:
    build:
      target: gateway
    restart: unless-stopped
    init: true
    env_file:
      - ./apps/gateway/.env
    ports:
      - '${GATEWAY_FORWARD_PORT:-3000}:3000'
    depends_on:
      redis:
        condition: service_healthy

  router:
    build:
      target: router
    restart: unless-stopped
    init: true
    env_file:
      - ./apps/router/.env
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
