server {
  listen 8080;

  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS server, so the gateway hostname is resolved at request time.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # The gateway does not enable CORS, so nginx proxies API requests to it.
  # The upstream is set through a variable to defer resolution until the first
  # request, otherwise nginx crashes on startup when the gateway is not up yet.
  location /api/ {
    set $gateway_upstream http://gateway:3000;
    proxy_pass $gateway_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
